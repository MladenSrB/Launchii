name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: launchii-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/launchii.jks"
          chmod 600 "$RUNNER_TEMP/launchii.jks"
      - name: Build signed update
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/launchii.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export LAUNCHII_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          echo "RELEASE_TAG=v0.$LAUNCHII_VERSION_CODE" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Launchii.apk
          (cd dist && sha256sum Launchii.apk > Launchii.apk.sha256)
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Launchii.apk dist/Launchii.apk.sha256 --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" dist/Launchii.apk dist/Launchii.apk.sha256 \
              --target "$GITHUB_SHA" --title "Launchii ${RELEASE_TAG#v}" --latest \
              --notes "Built from commit $GITHUB_SHA. Install Launchii.apk once; subsequent releases appear in Home's Update pill. Android may request permission to install updates."
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/launchii.jks"
